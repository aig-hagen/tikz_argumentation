name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile documentation
        uses: xu-cheng/latex-action@v3
        with:
          root_file: argumentation-doc.tex

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        uses: teatimeguest/setup-texlive-action@v3
        with:
          packages: |
            scheme-basic
            l3build
            pgf
            pgfopts
            xcolor
            luatex
            lm

      - name: Run regression tests
        run: l3build check --show-log-on-error
